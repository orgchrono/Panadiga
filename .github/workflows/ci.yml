name: Panadiga CI & Cross-Platform Suite

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master", "**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  # ==========================================================================
  # 1. Shared Desktop Frontend Build (Reused Across Ubuntu & macOS Runners)
  # ==========================================================================
  frontend-bundle:
    name: Build Frontend Bundle (Vite Dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI Dependencies & Build Desktop + Android Dists
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline
          npm run build
          npm run build:android
          node -e "
            const fs = require('fs'), path = require('path');
            const forbidden = ['ircommander', 'panasonic_ir_catalog', '__PANADIGA_IR_BRIDGE__'];
            for (const f of fs.readdirSync('dist/assets')) {
              const txt = fs.readFileSync(path.join('dist/assets', f), 'utf8');
              for (const needle of forbidden) {
                if (txt.includes(needle)) {
                  console.error('LEAK: Desktop bundle contains Android-only token ' + needle + ' in ' + f);
                  process.exit(1);
                }
              }
            }
          "

      - name: Upload Reusable Desktop Frontend Dist Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panadiga-frontend-dist
          path: apps/desktop/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Reusable Android Frontend Dist Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panadiga-frontend-android-dist
          path: apps/desktop/dist-android/
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # 2. Full 9 Quality Gates Suite & Windows Release Build
  # ==========================================================================
  quality-gates-windows:
    name: Full 9 Quality Gates & Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Configure Dynamic Cache Environment Paths
        shell: pwsh
        run: |
          "PLAYWRIGHT_BROWSERS_PATH=$($env:RUNNER_TEMP)\ms-playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PIP_CACHE_DIR=$($env:RUNNER_TEMP)\pip-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache Playwright Chromium Browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json') }}

      - name: Install Desktop UI Dependencies
        working-directory: apps/desktop
        run: npm ci --prefer-offline

      - name: Install Playwright Chromium (on cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npx playwright install chromium

      - name: Cache Python Quality Tools Wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\pip-cache
          key: pip-${{ runner.os }}-py311-mypy-pytest-matplotlib

      - name: Install Python Quality Tools
        run: python -m pip install --prefer-binary mypy pytest matplotlib

      - name: Execute Full 9 Commit Quality Gates & Windows Release Build
        run: .\build.cmd --ci --desktop --strict-toolchains

      - name: Upload Windows Distribution Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panadiga-windows-x86_64
          path: |
            dist/panadiga.exe
            dist/panadiga-desktop.exe
            dist/panasonic_p7501_uart_unified.uf2
            dist/tools/
            dist/releases/panadiga-windows-x86_64.zip
            dist/releases/SHA256SUMS.txt
          retention-days: 30

  # ==========================================================================
  # 3. Cross-Platform Compilation & Regression Suite (Ubuntu & macOS)
  # ==========================================================================
  cross-platform:
    name: Platform Build & Tests (${{ matrix.os }})
    needs: [frontend-bundle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Download Prebuilt Frontend Bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panadiga-frontend-dist
          path: apps/desktop/dist

      - name: Ensure Fresh Frontend Timestamp for tauri-build
        run: touch apps/desktop/dist/index.html

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Cache Python Quality Tools Wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: pip-${{ runner.os }}-py311-mypy-pytest-matplotlib

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run Cargo Clippy & Native Rust Workspace Tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-deps -- -D warnings
          cargo test --workspace --bins --lib --tests

      - name: Compile & Run C11 Pico Firmware Host Tests (GCC / Clang)
        run: |
          python3 -c "from scripts.panadiga_ops import build_env; from scripts.validate_gates import _gate_c11_host; _gate_c11_host(build_env())"

      - name: Run Python Parity & Script Tests (Pytest)
        run: |
          python3 -m pip install --prefer-binary mypy pytest matplotlib
          python3 -m mypy --strict scripts
          python3 -m pytest scripts/tests -v

      - name: Compile Release Binaries
        run: cargo build --release -p panadiga-cli -p panadiga-desktop

      - name: Package Distribution
        run: |
          mkdir -p dist/tools
          cp -f target/release/panadiga dist/panadiga
          cp -f target/release/panadiga-desktop dist/panadiga-desktop
          chmod +x dist/panadiga dist/panadiga-desktop
          if [ -d "tools/ghidra" ]; then cp -rf tools/ghidra dist/tools/; fi
          if [ -f "tools/README.md" ]; then cp -f tools/README.md dist/tools/README.md; fi

      - name: Upload Platform Release Binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panadiga-${{ matrix.os }}
          path: |
            dist/panadiga
            dist/panadiga-desktop
          retention-days: 14

  # ==========================================================================
  # 4. Raspberry Pi Pico Firmware Dual Target (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ARM Embedded Toolchain, Ninja & CCache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build ccache libudev-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache Pico C/C++ Compilation Objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-pico-${{ runner.os }}-${{ hashFiles('firmware/pico-p7501/**') }}
          restore-keys: |
            ccache-pico-${{ runner.os }}-

      - name: Cache Raspberry Pi Pico SDK (2.1.1)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-2.1.1-${{ runner.os }}

      - name: Clone Raspberry Pi Pico SDK
        env:
          PICO_SDK_SHA: "bddd20f928ce76142793bef434d4f75f4af6e433"
        run: |
          if [ ! -d "${{ runner.temp }}/pico-sdk/.git" ]; then
            git init "${{ runner.temp }}/pico-sdk"
            git -C "${{ runner.temp }}/pico-sdk" remote add origin https://github.com/raspberrypi/pico-sdk.git
            git -C "${{ runner.temp }}/pico-sdk" fetch --depth 1 origin "$PICO_SDK_SHA"
            git -C "${{ runner.temp }}/pico-sdk" checkout --detach "$PICO_SDK_SHA"
            git -C "${{ runner.temp }}/pico-sdk" submodule update --init --depth 1
          fi
          ACTUAL_SHA="$(git -C "${{ runner.temp }}/pico-sdk" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$PICO_SDK_SHA" ]; then
            echo "ERROR: pico-sdk SHA mismatch (expected $PICO_SDK_SHA, got $ACTUAL_SHA)" >&2
            exit 1
          fi

      - name: Verify POSIX Launcher & Build Firmware in Parallel (RP2040 & RP2350)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          sh -n ./build.sh
          ./build.sh --pico --strict-toolchains
          mkdir -p target/pico-build/out
          cp crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2 target/pico-build/out/panasonic_p7501_uart_unified.uf2
          sha256sum target/pico-build/out/*.uf2

      - name: Upload Compiled Firmware Artifacts (UF2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: |
            target/pico-build/out/panasonic_p7501_uart_unified.uf2
          retention-days: 30

  # ==========================================================================
  # 5. Android Mobile APK Build (Tauri 2 Mobile / ARM64)
  # ==========================================================================
  android-apk:
    name: Android APK Build (Tauri 2 Mobile / ARM64)
    needs: [frontend-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-dual-abi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Prebuilt cargo-ndk
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-ndk

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Download Prebuilt Frontend Bundle & Install Tauri CLI
        run: |
          cd apps/desktop
          npm ci --prefer-offline

      - name: Restore Prebuilt Android Frontend Dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panadiga-frontend-android-dist
          path: apps/desktop/dist-android

      - name: Verify Android Target with Cargo Clippy (-D warnings)
        run: |
          touch apps/desktop/dist-android/index.html
          cargo clippy -p panadiga-core -p panadiga-desktop --lib --target aarch64-linux-android --no-deps -- -D warnings

      - name: Initialize, Build & Sign Verified Android APK
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          touch apps/desktop/dist-android/index.html
          cd apps/desktop
          if [ ! -d "src-tauri/gen/android" ]; then
            npx --yes @tauri-apps/cli@2.12.6 android init --ci --skip-targets-install
          fi
          npx --yes @tauri-apps/cli@2.12.6 android build --apk --ci --config src-tauri/tauri.android.conf.json --target aarch64 armv7
          cd ../..
          mkdir -p release-apk
          RAW_APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -path "*/universal/release/*.apk" | head -n 1)
          if [ -z "$RAW_APK_PATH" ]; then
            RAW_APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK_PATH" ]; then
            echo "ERROR: Android release APK not found under apps/desktop/src-tauri/gen/android." >&2
            exit 1
          fi
          python3 -m scripts.build_lanes.android_verify --sign-and-verify "$RAW_APK_PATH" release-apk/panadiga-android-arm64.apk
          shasum -a 256 "release-apk/panadiga-android-arm64.apk" > "release-apk/panadiga-android-arm64.apk.sha256"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panadiga-android-apk
          path: |
            release-apk/panadiga-android-arm64.apk
            release-apk/panadiga-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # 6. Supply-Chain, Advisories, Licenses & Secret Scanning
  # ==========================================================================
  security-supply-chain:
    name: Supply-Chain & Secrets Audit (deny / audit / gitleaks)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install Prebuilt Supply-Chain Scanners
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deny,cargo-audit,gitleaks

      - name: Verify Dependencies & Licenses (cargo-deny)
        run: cargo deny check

      - name: Check RustSec Advisories (cargo-audit)
        run: cargo audit

      - name: Scan Working Tree for Secrets (gitleaks)
        run: gitleaks detect --source . --no-git --redact
