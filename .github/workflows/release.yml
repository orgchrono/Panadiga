name: Release Multiplatform Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag version (e.g. v0.2.0)"
        required: false
        default: "v0.2.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  # ==========================================================================
  # 1. Shared Frontend Build (Built Once, Reused Across All 4 Target Platforms)
  # ==========================================================================
  frontend-bundle:
    name: Build Frontend Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Node Dependencies & Build Desktop + Android Frontends
        working-directory: apps/desktop
        run: |
          npm ci --prefer-offline
          npm run build
          npm run build:android

      - name: Upload Shared Desktop Frontend Dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-frontend-dist
          path: apps/desktop/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Shared Android Frontend Dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-frontend-android-dist
          path: apps/desktop/dist-android/
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # 2. Raspberry Pi Pico Firmware Dual Target (RP2040 & RP2350)
  # ==========================================================================
  pico-firmware:
    name: Pico Firmware Dual Target (RP2040 & RP2350)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ARM Embedded Toolchain, Ninja & CCache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build ccache libudev-dev pkg-config

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache Pico C/C++ Compilation Objects (ccache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-pico-release-${{ hashFiles('firmware/pico-p7501/**') }}
          restore-keys: |
            ccache-pico-release-

      - name: Cache Raspberry Pi Pico SDK (2.1.1)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pico-sdk
          key: pico-sdk-2.1.1-${{ runner.os }}

      - name: Clone Raspberry Pi Pico SDK
        env:
          PICO_SDK_SHA: "bddd20f928ce76142793bef434d4f75f4af6e433"
        run: |
          if [ ! -d "${{ runner.temp }}/pico-sdk/.git" ]; then
            git init "${{ runner.temp }}/pico-sdk"
            git -C "${{ runner.temp }}/pico-sdk" remote add origin https://github.com/raspberrypi/pico-sdk.git
            git -C "${{ runner.temp }}/pico-sdk" fetch --depth 1 origin "$PICO_SDK_SHA"
            git -C "${{ runner.temp }}/pico-sdk" checkout --detach "$PICO_SDK_SHA"
            git -C "${{ runner.temp }}/pico-sdk" submodule update --init --depth 1
          fi
          ACTUAL_SHA="$(git -C "${{ runner.temp }}/pico-sdk" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$PICO_SDK_SHA" ]; then
            echo "ERROR: pico-sdk SHA mismatch (expected $PICO_SDK_SHA, got $ACTUAL_SHA)" >&2
            exit 1
          fi

      - name: Build Firmware in Parallel (RP2040 & RP2350) + Unified UF2 Merge
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CXXFLAGS: "-include cstdint"
        run: |
          ./build.sh --pico --strict-toolchains
          mkdir -p target/pico-build/out
          cp crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2 target/pico-build/out/panasonic_p7501_uart_unified.uf2
          (cd target/pico-build/out && sha256sum panasonic_p7501_uart_unified.uf2 > panasonic_p7501_uart_unified.uf2.sha256)

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: |
            target/pico-build/out/*.uf2
            target/pico-build/out/*.uf2.sha256
          retention-days: 30

  # ==========================================================================
  # 3. Multi-Platform Binary Compilation & Packaging (Windows, Linux, macOS)
  # ==========================================================================
  build-release:
    name: Build (${{ matrix.platform.name }})
    needs: [frontend-bundle, pico-firmware]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_cli: target/x86_64-pc-windows-msvc/release/panadiga.exe
            bin_desktop: target/x86_64-pc-windows-msvc/release/panadiga-desktop.exe
            archive_ext: zip
            archive_name: panadiga-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_cli: target/x86_64-unknown-linux-gnu/release/panadiga
            bin_desktop: target/x86_64-unknown-linux-gnu/release/panadiga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-linux-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin_cli: target/aarch64-apple-darwin/release/panadiga
            bin_desktop: target/aarch64-apple-darwin/release/panadiga-desktop
            archive_ext: tar.gz
            archive_name: panadiga-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Download Shared Frontend Dist & Fresh Pico UF2 Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-frontend-dist
          path: apps/desktop/dist

      - name: Download Compiled Pico UF2 Firmware Images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: crates/panadiga-core/src/pico/firmware_bins

      - name: Ensure Fresh Frontend Timestamp for tauri-build
        shell: bash
        run: touch apps/desktop/dist/index.html

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.platform.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Compile Unified Panadiga Release Binaries
        run: cargo build --release --target ${{ matrix.platform.target }} -p panadiga-cli -p panadiga-desktop

      - name: Smoke Test Built Release CLI + NOR/MN103Vm Patch Suite
        run: ./${{ matrix.platform.bin_cli }} re verify-patches

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "staging_release"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "${{ matrix.platform.bin_cli }}" -Destination "$staging\panadiga.exe"
          Copy-Item "${{ matrix.platform.bin_desktop }}" -Destination "$staging\panadiga-desktop.exe"
          $uf2Src = "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2"
          if (Test-Path $uf2Src) {
              Copy-Item $uf2Src -Destination "$staging\panasonic_p7501_uart_unified.uf2"
          }
          New-Item -ItemType Directory -Path "$staging\tools" | Out-Null
          if (Test-Path "tools\ghidra") {
              Copy-Item "tools\ghidra" -Destination "$staging\tools\ghidra" -Recurse
          }
          Get-ChildItem -Path "tools" -Filter "*.cmd" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging\tools\"
          if (Test-Path "tools\README.md") {
              Copy-Item "tools\README.md" -Destination "$staging\tools\README.md"
          }
          Copy-Item "LICENSE" -Destination "$staging\LICENSE"

          if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z a -tzip -mx=5 "${{ matrix.platform.archive_name }}" ".\$staging\*"
          } else {
              Compress-Archive -Path "$staging\*" -DestinationPath "${{ matrix.platform.archive_name }}" -CompressionLevel Optimal
          }
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.platform.archive_name }}").Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD "${{ matrix.platform.archive_name }}.sha256"), "$hash  ${{ matrix.platform.archive_name }}`n")

      - name: Package Unix Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          RAW_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          staging="staging_release"
          mkdir -p "$staging/tools" "$staging/icons"
          cp "${{ matrix.platform.bin_cli }}" "$staging/panadiga"
          cp "${{ matrix.platform.bin_desktop }}" "$staging/panadiga-desktop"
          UF2_SRC="crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2"
          if [ -f "$UF2_SRC" ]; then cp "$UF2_SRC" "$staging/panasonic_p7501_uart_unified.uf2"; fi
          if [ -d "tools/ghidra" ]; then cp -r tools/ghidra "$staging/tools/ghidra"; fi
          if [ -f "tools/README.md" ]; then cp tools/README.md "$staging/tools/README.md"; fi
          if [ -f "apps/desktop/src-tauri/icons/128x128.png" ]; then cp apps/desktop/src-tauri/icons/128x128.png "$staging/icons/panadiga.png"; fi
          cp LICENSE "$staging/LICENSE"
          chmod +x "$staging/panadiga" "$staging/panadiga-desktop"

          if [ "${{ runner.os }}" = "Linux" ]; then
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'set -euo pipefail' \
              'SELF_DIR="$(cd "$(dirname "$0")" && pwd)"' \
              '"$SELF_DIR/panadiga" install-shortcut "$@"' \
              > "$staging/install-launcher.sh"
            chmod +x "$staging/install-launcher.sh"
          fi

          tar -czvf "${{ matrix.platform.archive_name }}" -C "$staging" .
          shasum -a 256 "${{ matrix.platform.archive_name }}" > "${{ matrix.platform.archive_name }}.sha256"

          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "[*] Building Debian package (.deb) with Freedesktop launcher & Hicolor icons..."
            deb_dir="panadiga_deb_pkg"
            mkdir -p \
              "$deb_dir/DEBIAN" \
              "$deb_dir/usr/bin" \
              "$deb_dir/usr/share/panadiga/tools" \
              "$deb_dir/usr/share/applications" \
              "$deb_dir/usr/share/pixmaps" \
              "$deb_dir/usr/share/icons/hicolor/32x32/apps" \
              "$deb_dir/usr/share/icons/hicolor/128x128/apps" \
              "$deb_dir/usr/share/icons/hicolor/256x256/apps"
            cp "${{ matrix.platform.bin_cli }}" "$deb_dir/usr/bin/panadiga"
            cp "${{ matrix.platform.bin_desktop }}" "$deb_dir/usr/bin/panadiga-desktop"
            chmod 755 "$deb_dir/usr/bin/panadiga" "$deb_dir/usr/bin/panadiga-desktop"
            cp apps/desktop/src-tauri/icons/32x32.png "$deb_dir/usr/share/icons/hicolor/32x32/apps/panadiga.png"
            cp apps/desktop/src-tauri/icons/128x128.png "$deb_dir/usr/share/icons/hicolor/128x128/apps/panadiga.png"
            cp apps/desktop/src-tauri/icons/128x128@2x.png "$deb_dir/usr/share/icons/hicolor/256x256/apps/panadiga.png"
            cp apps/desktop/src-tauri/icons/128x128.png "$deb_dir/usr/share/pixmaps/panadiga.png"
            printf '%s\n' \
              '[Desktop Entry]' \
              'Version=1.0' \
              'Type=Application' \
              'Name=Panadiga' \
              'GenericName=Panasonic DIGA Engineering Suite' \
              'Comment=Panasonic DMR-EH55 Forensic, NVRAM, HDD & P7501 UART Suite' \
              'Exec=/usr/bin/panadiga-desktop %U' \
              'Icon=panadiga' \
              'Terminal=false' \
              'Categories=Development;Utility;Electronics;' \
              'Keywords=Panasonic;DIGA;DMR-EH55;MEIHDFS;Pico;MN103S;U99;' \
              'StartupNotify=true' \
              'StartupWMClass=panadiga-desktop' \
              > "$deb_dir/usr/share/applications/panadiga.desktop"
            chmod 644 "$deb_dir/usr/share/applications/panadiga.desktop"
            if [ -f "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2" ]; then
              cp "crates/panadiga-core/src/pico/firmware_bins/panasonic_p7501_uart_unified.uf2" "$deb_dir/usr/share/panadiga/panasonic_p7501_uart_unified.uf2"
            fi
            if [ -d "tools/ghidra" ]; then cp -r tools/ghidra "$deb_dir/usr/share/panadiga/tools/ghidra"; fi
            if [ -f "tools/README.md" ]; then cp tools/README.md "$deb_dir/usr/share/panadiga/tools/README.md"; fi
            printf '%s\n' \
              '#!/bin/sh' \
              'set -e' \
              'if command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database -q /usr/share/applications || true; fi' \
              'if command -v gtk-update-icon-cache >/dev/null 2>&1; then gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true; fi' \
              > "$deb_dir/DEBIAN/postinst"
            cp "$deb_dir/DEBIAN/postinst" "$deb_dir/DEBIAN/postrm"
            chmod 755 "$deb_dir/DEBIAN/postinst" "$deb_dir/DEBIAN/postrm"
            RAW_VERSION="${RAW_VERSION:-}"
            DEB_VERSION="${RAW_VERSION#v}"
            if ! printf '%s' "$DEB_VERSION" | grep -Eq '^[0-9][0-9A-Za-z.+~-]*$'; then
              DEB_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
            fi
            printf "Package: panadiga\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: OrgChrono Engineering <support@orgchrono.com>\nDepends: libc6, libwebkit2gtk-4.1-0, libayatana-appindicator3-1 | libappindicator3-1\nDescription: Panasonic DIGA DMR-EH55 Forensic, NVRAM and Reverse Engineering Suite\n" "$DEB_VERSION" > "$deb_dir/DEBIAN/control"
            dpkg-deb --build "$deb_dir" "panadiga-linux-amd64.deb"
            shasum -a 256 "panadiga-linux-amd64.deb" > "panadiga-linux-amd64.deb.sha256"
          fi

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panadiga-${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.archive_name }}
            ${{ matrix.platform.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debian Package Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panadiga-linux-deb
          path: |
            panadiga-linux-amd64.deb
            panadiga-linux-amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 4. Android Mobile APK Build & Release (AArch64)
  # ==========================================================================
  release-android-apk:
    name: Build & Release Android APK (AArch64)
    needs: [frontend-bundle, pico-firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-android-dual-abi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Prebuilt cargo-ndk
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-ndk

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Dependencies & Restore Prebuilt Frontend
        run: |
          cd apps/desktop
          npm ci --prefer-offline

      - name: Download Shared Android Frontend Dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-frontend-android-dist
          path: apps/desktop/dist-android

      - name: Download Compiled Pico UF2s for Android Embedding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: crates/panadiga-core/src/pico/firmware_bins

      - name: Build, Sign & Verify Android Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PANADIGA_KS_PASS: ${{ secrets.PANADIGA_KS_PASS }}
          PANADIGA_KEY_PASS: ${{ secrets.PANADIGA_KEY_PASS }}
          IS_TAGGED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') }}
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          touch apps/desktop/dist-android/index.html
          cd apps/desktop
          if [ ! -d "src-tauri/gen/android" ]; then
            npx --yes @tauri-apps/cli@2.12.6 android init --ci --skip-targets-install
          fi
          npx --yes @tauri-apps/cli@2.12.6 android build --apk --ci --config src-tauri/tauri.android.conf.json --target aarch64 armv7
          cd ../..
          mkdir -p release-apk
          RAW_APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -path "*/universal/release/*.apk" | head -n 1)
          if [ -z "$RAW_APK_PATH" ]; then
            RAW_APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name "*-release*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK_PATH" ]; then
            echo "ERROR: Android release APK not found under apps/desktop/src-tauri/gen/android." >&2
            exit 1
          fi
          SIGN_FLAGS=()
          TMP_KS=""
          cleanup_ks() {
            if [ -n "$TMP_KS" ] && [ -f "$TMP_KS" ]; then
              rm -f "$TMP_KS"
            fi
          }
          trap cleanup_ks EXIT
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            TMP_KS="$(mktemp /tmp/panadiga-release-XXXXXX.keystore)"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$TMP_KS"
            chmod 600 "$TMP_KS"
            SIGN_FLAGS+=(--keystore "$TMP_KS" --key-alias "${ANDROID_KEY_ALIAS:-panadigarelease}")
          fi
          if [ "${IS_TAGGED_RELEASE:-false}" = "true" ]; then
            SIGN_FLAGS+=(--require-release-keystore)
          fi
          python3 -m scripts.build_lanes.android_verify "${SIGN_FLAGS[@]}" --sign-and-verify "$RAW_APK_PATH" release-apk/panadiga-android-arm64.apk
          shasum -a 256 "release-apk/panadiga-android-arm64.apk" > "release-apk/panadiga-android-arm64.apk.sha256"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panadiga-android-apk
          path: |
            release-apk/panadiga-android-arm64.apk
            release-apk/panadiga-android-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 5. Unified Atomic GitHub Release Publisher + Master SHA256SUMS.txt
  # ==========================================================================
  publish-release:
    name: Publish Atomic GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [pico-firmware, build-release, release-android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Release Notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/RELEASE_NOTES.md

      - name: Download Pico Firmware Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: panasonic_p7501_uart_firmware_binaries
          path: dist-release

      - name: Download Desktop & Android Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "panadiga-*"
          merge-multiple: true
          path: dist-release

      - name: Generate Unified SHA256SUMS.txt
        run: |
          cd dist-release
          sha256sum panasonic_p7501_uart_unified.uf2 panadiga-*.zip panadiga-*.tar.gz panadiga-*.deb panadiga-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish All Assets Atomically to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist-release/*
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false
