[project]
name = "panadiga-scripts"
version = "0.2.0"
description = "Panadiga build, validation, forensics, and reverse-engineering automation scripts"
requires-python = ">=3.10"

[tool.mypy]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["scripts/tests", "target", "apps/desktop/node_modules", ".git"]
