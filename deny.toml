[advisories]
ignore = [
    # Transitive unmaintained warning via upstream Tauri / proc-macro crates (no security impact).
    "RUSTSEC-2024-0370",
    # Transitive gtk3/webkit2gtk Linux binding (`glib 0.18`); VariantStrIter not invoked by Panadiga.
    "RUSTSEC-2024-0429",
    # Transitive ecosystem `chrono` unmaintained advisory across indirect dependencies.
    "RUSTSEC-2026-0543",
]
yanked = "warn"

[licenses]
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
    "MIT-0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
