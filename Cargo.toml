[workspace]
resolver = "2"
members = [
    "crates/panadiga-constants",
    "crates/panadiga-bench",
    "crates/panadiga-vault",
    "crates/panadiga-crypto",
    "crates/panadiga-ir",
    "crates/panadiga-profiles",
    "crates/panadiga-core",
    "crates/panadiga-rag",
    "crates/panadiga-mcp",
    "crates/panadiga-cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/panadiga-constants",
    "crates/panadiga-bench",
    "crates/panadiga-vault",
    "crates/panadiga-crypto",
    "crates/panadiga-ir",
    "crates/panadiga-profiles",
    "crates/panadiga-core",
    "crates/panadiga-rag",
    "crates/panadiga-mcp",
    "crates/panadiga-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["Antigravity Systems Engineering Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
dirs = "7.0.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hex = "0.4"
lopdf = "0.47.0"
lzma-rs = "0.3"
md-5 = "0.10"
memmap2 = "0.9"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
panadiga-bench = { path = "crates/panadiga-bench" }
panadiga-constants = { path = "crates/panadiga-constants" }
panadiga-crypto = { path = "crates/panadiga-crypto" }
panadiga-ir = { path = "crates/panadiga-ir" }
panadiga-profiles = { path = "crates/panadiga-profiles" }
panadiga-vault = { path = "crates/panadiga-vault" }
rayon = "1.12"
regex = "1.10"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serialport = "4.5"
sha2 = "0.10"
tauri = { version = "2.0", default-features = false, features = ["wry"] }
tauri-build = { version = "2.0", default-features = false, features = [] }
thiserror = "2.0"
tracing = "0.1"
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["metrics"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 20
incremental = true
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
